name: Docker image

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Test initialization and persistence
        run: python -m unittest discover -s docker/tests -v
      - name: Check Compose configuration
        run: PUBLIC_HOST=vps.example.com docker compose -f docker/compose.yaml config --quiet
      - uses: docker/setup-buildx-action@v3
      - name: Build test image
        uses: docker/build-push-action@v7
        with:
          context: ./docker
          load: true
          tags: xlink:smoke
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64
      - name: Test REALITY, Noise tunnel and restart behavior
        run: python docker/tests/smoke.py xlink:smoke

  publish:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: metadata
        with:
          images: |
            ghcr.io/nekoimi/xlink-runtime
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - name: Build and push amd64/arm64 images
        uses: docker/build-push-action@v7
        with:
          context: ./docker
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: |
            type=gha,scope=amd64
            type=gha,scope=multiarch
          cache-to: type=gha,mode=max,scope=multiarch

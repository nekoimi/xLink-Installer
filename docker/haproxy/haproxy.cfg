global
    log stdout format raw local0
    maxconn 4096

defaults
    log global
    mode tcp
    option tcplog
    timeout connect 5s
    timeout client 1h
    timeout server 1h

# Refresh the backend address when Docker recreates the xlink container.
resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 10s
    hold obsolete 10s
    hold nx 1s
    hold timeout 1s
    hold refused 1s
    hold other 1s

frontend https
    bind :443
    default_backend rathole

backend rathole
    # No active probes: Rathole only listens after its client authenticates.
    # PROXY v2 precedes the unchanged TLS stream; the inner Caddy parses it.
    server tunnel xlink:443 send-proxy-v2 resolvers docker resolve-prefer ipv4 init-addr libc,none
